# The checks every change has to pass, one job per check on the pull request:
# - Gate: lint and conventions, the quality gates (complexity, size, code smells, unused code and
#   duplicated blocks against their baselines, no circular imports) with their report as an
#   artifact, types, unit tests with 100 % coverage on src/lib, and the production build. One step
#   per command, so a red run names the command that failed and stops there.
# - Reproducible build: rebuilds the extension from its sources zip and compares it with the XPI.
# - E2E (meet), E2E (zoom), E2E (teams): the end-to-end scenarios in Firefox, against one meeting
#   service's fake page each, so a red check names the service. A service's run takes about 25
#   minutes, so it is split over three jobs side by side, E2E (<service>, <k> of 3), each with every
#   third scenario (E2E_SHARD), and the check of the service passes once all three did. The End-to-
#   end scope job first decides which services the run needs
#   (scripts/ci/decide-e2e-scope.ts): on a pull request and in the merge queue, the services whose
#   code the change touches (all of them for shared code, none for documentation or unit tests);
#   on a release (release.yml calls this workflow), every night and when started by hand, all of
#   them; on the push to main, none,
#   since the merge queue tested that commit. A job left out still reports its check, every step
#   skipped and the reason in its summary.
# - Windows (install, check, test): what a contributor runs on Windows itself; not required. It
#   runs on pull requests, every night and by hand.
#
# Every job ends with its report, failed or not: a summary on the run's page (each step's result
# and time; for the failed step its errors, the command that runs it locally and where the whole
# log is), annotations on the lines the errors name, and the same as JSON in the artifact
# ci-report-<job>. CONTRIBUTING.md, "When CI fails", says how to read them.
name: CI

on:
  pull_request:
  # The merge queue's runs: a queued pull request is tested together with main and the ones
  # ahead of it, and merged only when every check passes.
  merge_group:
  push:
    branches: [main]
  # The whole suite on main every night, since pull requests run only the services they touch.
  schedule:
    - cron: '23 4 * * *'
  # The whole suite by hand.
  workflow_dispatch:
  # The whole suite on a release: release.yml runs it on its tag before the draft.
  workflow_call:

# The checks only read the code. Pull requests from forks get no secrets either way.
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Runs each step's script with bash, as GitHub's default shell does (-eo pipefail), and records
    # the script, its exit status, its time and its output for the job's report. Plain Node.js,
    # no package: the step that installs the dependencies runs through it too.
    shell: node scripts/ci/run-step.ts {0}

jobs:
  # Which services' end-to-end jobs this run needs, and why (see the top of this file).
  scope:
    name: End-to-end scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      providers: ${{ steps.scope.outputs.providers }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The history back to the base, to list the files the change touches.
          fetch-depth: 0

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Decide which services run end to end
        id: scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: pnpm exec tsx scripts/ci/e2e-scope.ts --providers meet,zoom,teams

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Each step has an id: the report names the steps by it.
    steps:
      # Actions are pinned to commits (tag in the comment), so a moved tag cannot change what runs.
      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # .nvmrc names 24, the active LTS and the Node.js addons.mozilla.org's reviewers build with;
      # package.json asks for Node >= 22.14.
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      # pnpm's version comes from `packageManager` in package.json; the store is cached by lockfile.
      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          cache: true

      # postinstall runs `wxt prepare`, which generates the .wxt types the checks below need.
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint and conventions (pnpm check:lint)
        id: lint
        run: pnpm check:lint

      # Per-function metrics and code smells (eslint.config.js), unused code (knip.jsonc) and
      # duplicated blocks, each against a checked-in baseline of known offenders that no value may
      # exceed (quality-baseline.json, .jscpd-baseline.json; a better value passes and is listed,
      # and the Tight baselines workflow lowers them), and circular imports
      # (.dependency-cruiser.cjs), of which there may be none. The same run writes the full report
      # (.quality/report.html and report.json), pass or fail.
      - name: Quality gates and report (pnpm quality:report)
        id: quality
        run: pnpm quality:report

      # The report of every run, failed ones too: the run's page lists it under Artifacts.
      # .quality/ is a dot-folder, which upload-artifact leaves out unless told otherwise.
      - name: Upload the quality report
        id: quality_upload
        if: ${{ always() && steps.quality.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: quality-report
          path: .quality/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Types (tsc --noEmit)
        id: types
        run: pnpm exec tsc --noEmit

      - name: Unit tests, 100 % coverage on src/lib (pnpm test:coverage)
        id: unit
        run: pnpm test:coverage

      # The build also checks the licences of what it bundles: it fails on a package under a licence
      # the project may not ship (the project is MIT: permissive licences or MPL-2.0 only), or
      # without a licence text, and otherwise writes LICENSE and THIRD-PARTY-NOTICES.md into the
      # extension.
      - name: Production build and licence check (pnpm build)
        id: build
        run: pnpm build

      - name: LICENSE and third-party notices in the build
        id: notices
        run: |
          for file in LICENSE THIRD-PARTY-NOTICES.md; do
            if [ ! -s ".output/firefox-mv3/$file" ]; then
              echo "::error::the build has no $file"
              exit 1
            fi
          done
          echo "packages: $(grep -c '^## ' .output/firefox-mv3/THIRD-PARTY-NOTICES.md)"

      # Only the self-distributed build (ZEN_RECORDER_CHANNEL=self, the release workflow's unlisted
      # build) names an update manifest; addons.mozilla.org refuses a listed submission that
      # carries one.
      - name: No update_url outside the self-distributed build
        id: update_url
        run: |
          jq '.browser_specific_settings' .output/firefox-mv3/manifest.json
          jq -e '.browser_specific_settings.gecko | has("update_url") | not' \
            .output/firefox-mv3/manifest.json >/dev/null

      # Whatever happened before. Plain bash: it reads the other steps' records and leaves none.
      - name: Report (summary, annotations, ci-report.json)
        if: ${{ always() }}
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: pnpm exec tsx scripts/ci/write-report.ts --job gate --name Gate

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-report-gate
          path: ${{ runner.temp }}/ci-report/report/
          if-no-files-found: warn
          retention-days: 14

  # What a contributor runs on Windows itself, where pnpm runs package scripts with cmd: install,
  # the checks, the types, the unit tests and both builds. It is not a required check: it shows
  # which of them work there, and CONTRIBUTING's "Windows" says what it covers. The steps run
  # through bash (Git Bash, which the runner has) for the job's report; pnpm still runs each
  # package script with cmd.
  windows:
    name: Windows (install, check, test)
    if: contains(fromJSON('["pull_request", "schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint, conventions and quality gates (pnpm check)
        id: check
        run: pnpm check

      - name: Types (pnpm compile)
        id: types
        run: pnpm compile

      - name: Unit tests (pnpm test)
        id: unit
        run: pnpm test

      - name: Production build (pnpm build)
        id: build
        run: pnpm build

      - name: End-to-end build (pnpm build:e2e)
        id: build_e2e
        run: pnpm build:e2e

      - name: Report (summary, annotations, ci-report.json)
        if: ${{ always() }}
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: pnpm exec tsx scripts/ci/write-report.ts --job windows --name "Windows (install, check, test)"

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-report-windows
          path: ${{ runner.temp }}/ci-report/report/
          if-no-files-found: warn
          retention-days: 14

  # addons.mozilla.org's reviewers rebuild the extension from the sources zip and compare the
  # result with the XPI, and there must be no difference. This job does the same on every change,
  # with the commands README-REVIEWERS.md gives them, so a build that depends on a file the zip
  # leaves out (a test, a hidden file, a file git does not track) fails here, not in a review.
  reproducible:
    name: Reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The build addons.mozilla.org will list: no update_url.
      - name: Build the XPI and the sources zip (pnpm zip)
        id: zip
        run: pnpm zip

      - name: Rebuild from the sources zip and compare with the XPI
        id: rebuild
        run: |
          version="$(jq -r .version package.json)"
          scripts/release/check-reproducible-build.sh ".output/zen-recorder-$version-firefox.zip" \
            ".output/zen-recorder-$version-sources.zip"

      - name: Report (summary, annotations, ci-report.json)
        if: ${{ always() }}
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
        run: pnpm exec tsx scripts/ci/write-report.ts --job reproducible-build --name "Reproducible build"

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-report-reproducible-build
          path: ${{ runner.temp }}/ci-report/report/
          if-no-files-found: warn
          retention-days: 14

  # The end-to-end scenarios (scripts/e2e/), as `pnpm test:e2e` runs them on a developer's machine:
  # the test build of the extension in a headless Firefox with fake media, one job per service so
  # the services run side by side and each check says which one failed.
  e2e:
    name: E2E (${{ matrix.provider }}, ${{ matrix.shard }} of 3)
    needs: scope
    # Also when the scope job failed: then every service runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [meet, zoom, teams]
        # Each job runs every third scenario of the run order (scripts/e2e/shard-scenarios.ts).
        shard: [1, 2, 3]
    env:
      # Where the private audio server puts its socket. Runners set no XDG_RUNTIME_DIR, and the
      # audio script's fallback, /run/user/<uid>, does not exist there.
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      # Whether this service is in the run's scope; every service when the scope job said nothing.
      IN_SCOPE: ${{ contains(fromJSON(needs.scope.outputs.providers || '["meet", "zoom", "teams"]'), matrix.provider) }}
    steps:
      # A required check must report, so a job left out runs this step alone. Plain bash: without
      # the checkout there is no run-step.ts.
      - name: Out of this run's scope
        id: out_of_scope
        if: env.IN_SCOPE != 'true'
        shell: bash
        env:
          REASON: ${{ needs.scope.outputs.reason }}
        run: |
          echo "Not run: $REASON. Every service runs on a release, every night and when CI is started by hand."
          echo "Not run: $REASON. Every service runs on a release, every night and when CI is started by hand." >>"$GITHUB_STEP_SUMMARY"

      - name: Check out
        id: checkout
        if: env.IN_SCOPE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        id: node
        if: env.IN_SCOPE == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        id: pnpm
        if: env.IN_SCOPE == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        id: install
        if: env.IN_SCOPE == 'true'
        run: pnpm install --frozen-lockfile

      # The run reads the saved files with ffmpeg and ffprobe, and the image has neither. The audio
      # script below unpacks PulseAudio itself; the package brings the libraries it needs.
      - name: ffmpeg and PulseAudio's libraries (apt-get)
        id: packages
        if: env.IN_SCOPE == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg pulseaudio

      # The latest Firefox release, the one `pnpm setup:firefox` downloads, keys the cached copy.
      - name: Firefox's latest version
        id: firefox_version
        if: env.IN_SCOPE == 'true'
        run: |
          version="$(pnpm --silent setup:firefox --latest-version)"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Restore Firefox from the cache
        id: firefox_cache
        if: env.IN_SCOPE == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .tools/firefox
          key: firefox-${{ runner.os }}-${{ runner.arch }}-${{ steps.firefox_version.outputs.version }}

      # Downloads it when the cache had no copy; otherwise prints the cached copy's version.
      - name: Firefox (pnpm setup:firefox)
        id: firefox
        if: env.IN_SCOPE == 'true'
        run: pnpm setup:firefox

      # Firefox runs its audio graph only when it can open an audio output, and the runner has
      # none: a private PulseAudio server with a silent output, which the run finds by itself.
      - name: Audio output (scripts/test-audio.sh)
        id: audio
        if: env.IN_SCOPE == 'true'
        run: |
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          scripts/test-audio.sh setup
          scripts/test-audio.sh start

      # Builds the test flavour of the extension, then runs every scenario on the service's page.
      - name: End-to-end scenarios on the fake ${{ matrix.provider }} page, shard ${{ matrix.shard }} of 3 (pnpm test:e2e)
        id: e2e
        if: env.IN_SCOPE == 'true'
        run: E2E_PROVIDERS=${{ matrix.provider }} E2E_SHARD=${{ matrix.shard }}/3 pnpm test:e2e

      # The saved recordings and the extension's Diagnostics log, for whoever looks into it.
      - name: Upload what the failed run left
        id: e2e_upload
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-${{ matrix.provider }}-${{ matrix.shard }}
          path: .e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Report (summary, annotations, ci-report.json)
        if: ${{ always() && env.IN_SCOPE == 'true' }}
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT: ${{ steps.e2e_upload.outcome == 'success' && format('e2e-{0}-{1}', matrix.provider, matrix.shard) || '' }}
        run: >-
          pnpm exec tsx scripts/ci/write-report.ts --job "e2e-${{ matrix.provider }}-${{ matrix.shard }}"
          --name "E2E (${{ matrix.provider }}, ${{ matrix.shard }} of 3)" ${ARTIFACT:+--artifact "$ARTIFACT"}

      - name: Upload the report
        if: ${{ always() && env.IN_SCOPE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-report-e2e-${{ matrix.provider }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-report/report/
          if-no-files-found: warn
          retention-days: 14

  # The required check of each service: it passes once the three jobs of its run passed (a job left
  # out of the run's scope passes with its steps skipped). Their reports say what failed.
  e2e-result:
    name: E2E (${{ matrix.provider }})
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The run's jobs and their results.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        provider: [meet, zoom, teams]
    steps:
      # Plain bash: this job checks nothing out.
      - name: The three jobs of the service's run
        id: result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          # The latest attempt of each job, so a job run again counts with its new result. A
          # reusable workflow's jobs carry their caller's job name before " / ".
          results="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" |
            jq -r --arg p "$PROVIDER" '.jobs[] | select(.name | test("(^| / )E2E \\(" + $p + ", [0-9]+ of 3\\)$")) | "\(.name): \(.conclusion)"')"
          echo "$results"
          if [[ $(grep -c ': success$' <<<"$results") -ne 3 ]]; then
            echo "::error::E2E ($PROVIDER) needs its three jobs to pass: their reports say what failed."
            exit 1
          fi
