# Releases the extension. The "Start a release" workflow (start-release.yml) tags main's commit
# and runs this one on the tag in the release mode; pushing the tag v<version> by hand does the
# same. Either way it runs the gate, builds the XPI and runs the whole CI on the tag. Once both
# passed, it publishes the GitHub Release as an unsigned pre-release: the unsigned XPI
# (zen-recorder-<version>-unsigned.xpi), the sources zip, and the notes opening with a notice that
# the file is not signed yet. GitHub's releases/latest skips pre-releases, so it keeps naming the
# newest signed release. Once the maintainer approves the `release` environment,
# addons.mozilla.org (AMO) signs the XPI; the signed XPI is attached, the pre-release becomes the
# release (the unsigned file deleted, the notes without the notice, marked latest), and the update
# manifest that copies installed from a GitHub Release check once a day is published on the
# gh-pages branch, which GitHub Pages serves. The update manifest only ever names a signed file.
#
# AMO signs on the channel the repository variable AMO_CHANNEL names (Settings → Secrets and
# variables → Actions → Variables), which the maintainer sets once:
# - unlisted, the default: the self-distributed build (ZEN_RECORDER_CHANNEL=self), whose manifest
#   names the update manifest. AMO keeps one version number per add-on across both channels, so a
#   version signed here can never be listed.
# - listed, for the AMO listing: the build without ZEN_RECORDER_CHANNEL, whose manifest names no
#   update manifest (AMO refuses one on this channel), sent with the listing's metadata. The
#   release offers the file AMO serves, and its entry in the update manifest moves the copies
#   installed from GitHub to it; from then on they update from AMO.
#
# Run by hand (Actions → Release → Run workflow):
# - release, on the tag: the whole release, as for a pushed tag. "Start a release" runs it so.
# - dry-run, on any branch or tag: the gate, the build of each channel, the unsigned XPI, the
#   sources zip, the notes of the release and of its pre-release, and a preview of updates.json,
#   uploaded as the run's artifacts. Nothing is published or signed. Pull requests that change the
#   release run it too.
# - publish, on the tag: finishes a release whose signing timed out, which stays a pre-release
#   meanwhile. AMO can hold a version for manual review for days; once AMO approved it, this mode
#   runs with AMO_CHANNEL as it was for the tag. The hourly "Finish a signed release" workflow
#   (finish-release.yml) starts it for a listed version AMO made public; it can be run by hand too.
#   It fetches the signed XPI from AMO's API (or takes one attached to the release by hand), checks
#   it, switches the pre-release to the release and publishes the update manifest. On a release
#   that is finished already it changes nothing but publishing the site again.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/amo-metadata/**
      - .github/release-notes-footer.md
      - .github/pre-release-notice.md
      - .nvmrc
      - README-REVIEWERS.md
      - scripts/release/**
      - scripts/release-notes.sh
      - site/**
      - wxt.config.ts
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: build and preview, publish nothing. release (on a tag): the whole release, as for a pushed tag. publish (on a tag): finish the pre-release once AMO approved its version: attach the signed XPI and publish the release.'
        type: choice
        options: [dry-run, release, publish]
        default: dry-run

# Only the jobs that write the release and the site get more, each for itself.
permissions:
  contents: read

# A release runs to its end; a newer push to a pull request replaces its dry run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.channel }})
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A release (a pushed tag, or the release mode) builds the channel AMO_CHANNEL names. A dry run
    # builds both, so a pull request shows either release before the variable picks one.
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON((github.event_name == 'push' || inputs.mode == 'release') && format('["{0}"]', vars.AMO_CHANNEL || 'unlisted') || '["unlisted", "listed"]') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ matrix.channel }}
    steps:
      # The variable is typed by hand, and a typo must not sign the wrong build.
      - name: Check the channel (listed or unlisted)
        id: channel
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          case $CHANNEL in
          unlisted) echo "build=self" >>"$GITHUB_OUTPUT" ;;
          listed) echo "build=" >>"$GITHUB_OUTPUT" ;;
          *)
            echo "::error::The repository variable AMO_CHANNEL is \"$CHANNEL\": set it to listed or unlisted."
            exit 1
            ;;
          esac

      # Actions are pinned to commits (tag in the comment), so a moved tag cannot change what runs.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          cache: true

      - name: Read the version (a tag must name package.json's)
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MODE: ${{ inputs.mode }}
        run: |
          version="$(jq -r .version package.json)"
          if [[ $MODE == release && $REF_TYPE != tag ]]; then
            echo "::error::The release mode runs on a release tag: start it with the Start a release workflow, or choose the tag v$version under \"Use workflow from\"."
            exit 1
          fi
          if [[ $REF_TYPE == tag && $REF_NAME != "v$version" ]]; then
            echo "::error::The tag $REF_NAME does not match package.json's version $version: tag the release commit v$version."
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # Before the slow steps: a version without a changelog section stops here.
      - name: Check the release notes (the version's CHANGELOG.md section)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" >/dev/null

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and conventions (pnpm check)
        run: pnpm check

      - name: Types (tsc --noEmit)
        run: pnpm exec tsc --noEmit

      - name: Unit tests, 100 % coverage on src/lib (pnpm test:coverage)
        run: pnpm test:coverage

      # `wxt zip` builds before it zips, so the build's channel is set for this one command. The
      # unlisted release is the self-distributed build (ZEN_RECORDER_CHANNEL=self), whose manifest
      # names the update manifest; the listed release is the build without it, which names none.
      - name: Build and zip the add-on (pnpm zip)
        env:
          ZEN_RECORDER_CHANNEL: ${{ steps.channel.outputs.build }}
        run: pnpm zip

      # The sources zip goes to addons.mozilla.org with the XPI, and its reviewers rebuild the XPI
      # from it with the commands of README-REVIEWERS.md; they must get the same files.
      - name: Rebuild from the sources zip and compare with the XPI
        env:
          ZEN_RECORDER_CHANNEL: ${{ steps.channel.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release/check-reproducible-build.sh ".output/zen-recorder-$VERSION-firefox.zip" \
            ".output/zen-recorder-$VERSION-sources.zip"

      # The unsigned XPI is the pre-release's file until AMO signed it. It is checked as the signed
      # one will be (version, add-on id, the update_url its channel needs or forbids), but for the
      # signature, and the preview shows the entry the release adds to the update manifest; the
      # signed file will have another hash. The manifest itself never names the unsigned file.
      - name: Check the unsigned XPI and preview the update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ matrix.channel }}
          RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases/download
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp ".output/zen-recorder-$VERSION-firefox.zip" \
            "$RUNNER_TEMP/release/zen-recorder-$VERSION-unsigned.xpi"
          cp ".output/zen-recorder-$VERSION-sources.zip" "$RUNNER_TEMP/release/"
          pnpm exec tsx scripts/release/write-update-manifest.ts --unsigned --channel "$CHANNEL" \
            --xpi "$RUNNER_TEMP/release/zen-recorder-$VERSION-unsigned.xpi" --version "$VERSION" \
            --update-link "$RELEASES/v$VERSION/zen-recorder-$VERSION.xpi" \
            --out "$RUNNER_TEMP/release/updates-preview.json"
          jq '{version, browser_specific_settings}' .output/firefox-mv3/manifest.json
          cat "$RUNNER_TEMP/release/updates-preview.json"

      # The release's notes, and the pre-release's: the same, opening with the notice of
      # .github/pre-release-notice.md and the unsigned XPI's SHA-256.
      - name: Release notes (the version's CHANGELOG.md section, the install steps, the notice)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec tsx scripts/release/write-release-notes.ts --version "$VERSION" \
            --out "$RUNNER_TEMP/release/release-notes.md"
          pnpm exec tsx scripts/release/write-release-notes.ts --version "$VERSION" \
            --unsigned-xpi "$RUNNER_TEMP/release/zen-recorder-$VERSION-unsigned.xpi" \
            --out "$RUNNER_TEMP/release/pre-release-notes.md"
          head -n 12 "$RUNNER_TEMP/release/pre-release-notes.md"

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-${{ steps.version.outputs.version }}-${{ matrix.channel }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  # The whole CI on the release's commit, every end-to-end scenario on every service: pull
  # requests and the merge queue run only the services a change touches. The pre-release waits for
  # it.
  ci:
    name: CI
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.mode == 'release')
    # What ci.yml's jobs need; a called workflow gets no more than its caller grants.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

  prerelease:
    name: Publish the unsigned pre-release
    needs: [build, ci]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.mode == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-${{ needs.build.outputs.version }}-${{ needs.build.outputs.channel }}
          path: release

      # No approval: starting the release is the maintainer's decision, and the unsigned XPI is
      # what the release built and checked. Everyone can download it while AMO reviews the version;
      # the notice says who can install it and how. A re-run refreshes the pre-release (or turns a
      # draft into it); a release that is published already, signed, is left alone.
      - name: Publish the pre-release with the unsigned XPI
        run: |
          xpi="release/zen-recorder-$VERSION-unsigned.xpi"
          sources="release/zen-recorder-$VERSION-sources.zip"
          title="Zen Recorder $VERSION (unsigned pre-release)"
          if state="$(gh release view "$TAG" --json isDraft,isPrerelease \
            --jq '"\(.isDraft) \(.isPrerelease)"' 2>/dev/null)"; then
            if [[ $state == "false false" ]]; then
              echo "::error::The release $TAG is published already, signed. To publish its update manifest again, run this workflow on the tag in the publish mode."
              exit 1
            fi
            gh release upload "$TAG" "$xpi" "$sources" --clobber
            gh release edit "$TAG" --title "$title" --notes-file release/pre-release-notes.md \
              --draft=false --prerelease
          else
            gh release create "$TAG" --prerelease --verify-tag --title "$title" \
              --notes-file release/pre-release-notes.md "$xpi" "$sources"
          fi
          {
            echo "### $title"
            echo
            echo "Published with the unsigned XPI: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG."
            echo "The next job waits for the \`release\` environment's approval before"
            echo "addons.mozilla.org signs it."
          } >>"$GITHUB_STEP_SUMMARY"

  ship:
    name: Sign and publish
    needs: [build, prerelease]
    # After the pre-release on a tag (pushed, or the release mode), or alone in the publish mode.
    if: >-
      !cancelled() && (
        (github.ref_type == 'tag' && (github.event_name == 'push' || inputs.mode == 'release') &&
          needs.prerelease.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
      )
    # Waits for the maintainer's approval; the AMO keys are secrets of this environment only.
    environment: release
    runs-on: ubuntu-24.04
    # AMO's approval can take up to the 30 minutes web-ext waits below.
    timeout-minutes: 60
    permissions:
      contents: write
    # The token that can write the release goes to the steps that need it, not to the install.
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      RELEASES: ${{ github.server_url }}/${{ github.repository }}/releases/download
      # The channel the tag's build was made for; the publish mode, which builds nothing, reads the
      # variable.
      CHANNEL: ${{ needs.build.outputs.channel || vars.AMO_CHANNEL || 'unlisted' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version (the run must be on its tag) and the channel
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="$(jq -r .version package.json)"
          if [[ $REF_TYPE != tag || $TAG != "v$version" ]]; then
            echo "::error::Publishing runs on the release tag v$version: choose it under \"Use workflow from\"."
            exit 1
          fi
          if [[ $CHANNEL != listed && $CHANNEL != unlisted ]]; then
            echo "::error::The repository variable AMO_CHANNEL is \"$CHANNEL\": set it to listed or unlisted."
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "XPI=zen-recorder-$version.xpi" >>"$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          cache: true

      # web-ext and tsx, at the versions of the lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The notes the release gets once signed: the pre-release's without its notice, from the tag
      # as the build wrote them, so the publish mode, which builds nothing, writes the same.
      - name: Release notes (without the pre-release notice)
        run: |
          pnpm exec tsx scripts/release/write-release-notes.ts --version "$VERSION" \
            --out "$RUNNER_TEMP/release-notes.md"

      - name: Download the build
        if: inputs.mode != 'publish'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-${{ steps.version.outputs.version }}-${{ env.CHANNEL }}
          path: release

      # The channel's metadata (.github/amo-metadata/<channel>.json) goes with every version: the
      # summary, the categories and the licence, which a listed version needs (the first one makes
      # the listing), and the notes to reviewer for that build. The first submission of the add-on
      # id creates it on AMO. The secrets reach this step only.
      - name: Sign on addons.mozilla.org (${{ env.CHANNEL }}) and attach the signed XPI
        if: inputs.mode != 'publish'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          unzip -q "release/zen-recorder-$VERSION-unsigned.xpi" -d unsigned
          pnpm exec web-ext sign --channel "$CHANNEL" --source-dir unsigned --artifacts-dir signed \
            --upload-source-code "release/zen-recorder-$VERSION-sources.zip" \
            --approval-timeout 1800000 --amo-metadata ".github/amo-metadata/$CHANNEL.json"
          shopt -s nullglob
          signed=(signed/*.xpi)
          if [[ ${#signed[@]} -ne 1 ]]; then
            echo "::error::Expected one signed XPI in signed/, found ${#signed[@]}."
            exit 1
          fi
          mv "${signed[0]}" "$XPI"
          gh release upload "$TAG" "$XPI" --clobber

      # The publish mode finishes a release whose signing timed out: once AMO approved the
      # version, its signed file comes from AMO's API, unless one was attached to the release by
      # hand.
      - name: Fetch the signed XPI from addons.mozilla.org (publish mode)
        if: inputs.mode == 'publish'
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$XPI"; then
            echo "$XPI is attached to the release already: publishing that one."
            exit 0
          fi
          pnpm exec tsx scripts/release/fetch-signed-xpi.ts --version "$VERSION" \
            --channel "$CHANNEL" --out "$XPI"
          gh release upload "$TAG" "$XPI" --clobber

      # What the release offers is what gets checked and hashed, however it got there.
      - name: Check the XPI attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern "$XPI" --dir published
          pnpm exec tsx scripts/release/write-update-manifest.ts --channel "$CHANNEL" \
            --xpi "published/$XPI" --version "$VERSION" --update-link "$RELEASES/$TAG/$XPI" \
            --out "$RUNNER_TEMP/updates-check.json"

      # The pre-release becomes the release: the unsigned XPI deleted, the notes without the
      # notice, its plain title, marked latest unless a newer version is out. Before the update
      # manifest, so the release offers only the signed file by then. A release that is finished
      # already is left as it is.
      - name: Switch the pre-release to the signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm exec tsx scripts/release/switch-to-signed-release.ts --version "$VERSION" \
            --notes "$RUNNER_TEMP/release-notes.md"

      # git pushes with the job's token, given to this step only.
      - name: Publish the site and the update manifest on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          scripts/release/update-pages.sh --channel "$CHANNEL" "$VERSION" "published/$XPI" \
            "$RELEASES/$TAG/$XPI"
